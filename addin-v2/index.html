<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timsoft Signature</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; }
    .container { padding: 14px; max-width: 380px; }
    .header { display: flex; align-items: center; gap: 10px; padding: 14px 16px;
      background: #1a1f5e; border-radius: 12px; margin-bottom: 14px; }
    .logo { width: 36px; height: 36px; background: #fff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #1a1f5e; font-size: 13px; }
    .header h2 { color: #fff; font-size: 15px; margin-bottom: 1px; }
    .header p { color: rgba(255,255,255,0.65); font-size: 11px; }
    .loading { text-align: center; padding: 40px 20px; }
    .spinner { width: 30px; height: 30px; border: 3px solid #e5e7eb;
      border-top-color: #1a1f5e; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .user-card { display: flex; align-items: center; gap: 12px;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 12px; margin-bottom: 12px; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden;
      flex-shrink: 0; background: linear-gradient(135deg, #1a1f5e, #2d3491);
      display: flex; align-items: center; justify-content: center; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-txt { color: #fff; font-weight: 700; font-size: 16px; }
    .user-info strong { display: block; font-size: 13px; }
    .user-info small { font-size: 11px; color: #6b7280; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px; margin-top: 3px; }
    .badge.ok { background: #d1fae5; color: #065f46; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    .preview-card { background: #fff; border: 1px solid #e5e7eb;
      border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .preview-label { font-size: 11px; font-weight: 700; color: #6b7280;
      margin-bottom: 10px; text-transform: uppercase; }
    .btn-primary { width: 100%; padding: 12px;
      background: linear-gradient(135deg, #1a1f5e, #2d3491);
      color: #fff; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      margin-bottom: 8px; transition: opacity 0.15s; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary { width: 100%; padding: 10px; background: #fff;
      color: #1a1f5e; border: 1.5px solid #1a1f5e; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer; }
    .success { background: #d1fae5; color: #065f46; border-radius: 10px;
      padding: 12px; text-align: center; font-size: 13px;
      font-weight: 600; margin-top: 8px; }
    .error-box { background: #fee2e2; color: #dc2626; border-radius: 10px;
      padding: 12px; margin-bottom: 12px; font-size: 13px; }
    .debug-card { background: #0f1724; color: #d1d5db; border-radius: 10px;
      padding: 12px; margin-top: 12px; font-family: 'Consolas', monospace;
      font-size: 11px; max-height: 160px; overflow-y: auto; line-height: 1.6; }
    .debug-title { color: #9ca3af; font-weight: 700; margin-bottom: 6px;
      text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; }
    .debug-line { border-bottom: 1px solid #1f2937; padding: 3px 0; word-break: break-all; }
    .debug-ok { color: #34d399; }
    .debug-err { color: #f87171; }
    .debug-info { color: #93c5fd; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">ti</div>
    <div>
      <h2>Timsoft Signature</h2>
      <p>Gestion centralisée des signatures</p>
    </div>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p style="font-size:13px;color:#6b7280;">Chargement...</p>
  </div>

  <div id="error-box" class="error-box" style="display:none;">
    <span id="error-msg"></span><br>
    <button onclick="init()" style="margin-top:8px;background:#dc2626;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;">Réessayer</button>
  </div>

  <div id="content" style="display:none;">
    <div class="user-card">
      <div class="avatar" id="avatar">
        <span class="avatar-txt" id="initials">??</span>
      </div>
      <div class="user-info">
        <strong id="display-name">...</strong>
        <small id="display-email">...</small>
        <div class="badge ok" id="source-badge">Chargement...</div>
      </div>
    </div>

    <div class="preview-card">
      <div class="preview-label">📋 Aperçu de votre signature</div>
      <div id="preview"></div>
    </div>

    <button class="btn-primary" id="btn-insert" onclick="insertSignature()">
      ✅ Insérer ma signature
    </button>
    <button class="btn-secondary" onclick="init()">🔄 Actualiser</button>
    <div id="success" class="success" style="display:none;">
      ✅ Signature insérée dans votre email !
    </div>

    <div class="debug-card">
      <div class="debug-title">🔧 Debug — Connexion Dashboard</div>
      <div id="debug-log"></div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://cartoon-revoke-music.ngrok-free.dev/api';

  let userName      = '';
  let userEmail     = '';
  let signatureHtml = '';

  function getPublicAssetUrl(fileName) {
    const base = new URL('../', window.location.href);
    return new URL(fileName, base).href;
  }

  function normalizeTemplateAssets(html) {
    if (!html) return html;
    const logoUrl = getPublicAssetUrl('timsoft-logo.png');
    return html.replace(/src=(['"])(?:\.\.\/|\.\/|\/)?timsoft-logo\.png\1/gi, 'src="' + logoUrl + '"');
  }

  function log(msg, type) {
    console.log('[TimsoftAddin]', msg);
    const el = document.getElementById('debug-log');
    if (!el) return;
    const line = document.createElement('div');
    line.className = 'debug-line ' + (type === 'ok' ? 'debug-ok' : type === 'err' ? 'debug-err' : 'debug-info');
    line.textContent = msg;
    el.appendChild(line);
  }

  Office.onReady(async function(info) {
    if (info.host === Office.HostType.Outlook) {
      userEmail = Office.context.mailbox.userProfile.emailAddress;
      userName  = Office.context.mailbox.userProfile.displayName;
    } else {
      userEmail = 'demo@timsoft-group.com';
      userName  = 'Demo User';
    }
    await init();
  });

  async function init() {
    showLoading();
    document.getElementById('debug-log').innerHTML = '';
    log('Profil : ' + userName + ' <' + userEmail + '>', 'info');

    const initials = getInitials(userName);
    document.getElementById('initials').textContent      = initials;
    document.getElementById('display-name').textContent  = userName;
    document.getElementById('display-email').textContent = userEmail;

    log('Appel API : ' + API_URL + '/Signatures/by-email/' + userEmail + '/active', 'info');
    const dashboardHtml = await fetchSignatureFromDashboard(userEmail);

    if (dashboardHtml) {
      log('✅ Template Dashboard trouvé', 'ok');
      document.getElementById('source-badge').textContent = '✅ Template Dashboard';
      document.getElementById('source-badge').className = 'badge ok';

      const photoUrl = await loadPhotoFromOutlook();
      signatureHtml = injectPhotoAndQr(normalizeTemplateAssets(dashboardHtml), photoUrl);
      updateAvatar(photoUrl, initials);
    } else {
      log('⚠️ Dashboard indisponible ou utilisateur non trouvé — fallback générique', 'err');
      document.getElementById('source-badge').textContent = '⚠️ Signature générique (fallback)';
      document.getElementById('source-badge').className = 'badge warn';

      const photoUrl = await loadPhotoFromOutlook();
      updateAvatar(photoUrl, initials);
      buildFallbackSignature(photoUrl);
    }

    document.getElementById('preview').innerHTML = signatureHtml;
    showContent();
  }

  function updateAvatar(photoUrl, initials) {
    if (photoUrl) {
      document.getElementById('avatar').innerHTML = '<img src="' + photoUrl + '" alt="' + userName + '"/>';
      log('Avatar mis à jour avec la photo', 'ok');
    } else {
      log('Aucune photo — initiales utilisées', 'err');
    }
  }

  async function fetchSignatureFromDashboard(email) {
    const url = API_URL + '/Signatures/by-email/' + encodeURIComponent(email) + '/active';
    try {
      const res = await fetch(url, { headers: { 'ngrok-skip-browser-warning': 'true' } });
      log('Réponse API : HTTP ' + res.status, res.ok ? 'ok' : 'err');
      if (!res.ok) return null;
      const data = await res.json();
      return data.generatedHtml || null;
    } catch (e) {
      log('❌ Erreur fetch : ' + e.message, 'err');
      return null;
    }
  }

  function injectPhotoAndQr(html, photoUrl) {
    const qrUrl = buildQrDataUrl();
    const initials = getInitials(userName);
    const placeholder = '{{photoUrl}}';
    const idx = html.indexOf(placeholder);

    if (idx !== -1) {
      const tagStart = html.lastIndexOf('<img', idx);
      const tagEnd = html.indexOf('>', idx);
      if (tagStart !== -1 && tagEnd !== -1) {
        let replacement;
        if (photoUrl) {
          const imgTag = html.substring(tagStart, tagEnd + 1);
          replacement = imgTag.split(placeholder).join(photoUrl);
        } else {
          replacement = '<div style="width:65px;height:65px;border-radius:50%;' +
            'background:linear-gradient(135deg,#1a1f5e,#2d3491);display:flex;' +
            'align-items:center;justify-content:center;color:#fff;font-weight:700;' +
            'font-size:22px;">' + initials + '</div>';
        }
        html = html.substring(0, tagStart) + replacement + html.substring(tagEnd + 1);
      }
    }

    return html.split('{{qrCode}}').join(qrUrl);
  }

  function buildQrUrl() {
    const parts     = userName.trim().split(' ');
    const firstName = parts[0] || '';
    const lastName  = parts.slice(1).join(' ') || '';
    const vcard = [
      'BEGIN:VCARD','VERSION:3.0',
      'N:' + lastName + ';' + firstName + ';;;',
      'FN:' + firstName + ' ' + lastName,
      'ORG:Timsoft Group',
      'EMAIL:' + userEmail,
      'URL:https://www.timsoft-group.com',
      'END:VCARD'
    ].join('\n');
    return buildInlineQrDataUrl(vcard);
  }

  // ── Générateur de QR code réel (bibliothèque qrcode-generator, domaine public) ──
  // qrcode-generator (Kazuhiko Arase) — domaine public / MIT
  // Bibliothèque QR pure JS, sans dépendance, intégrable directement.
  var qrcode = (function() {
    var qrcode = function(typeNumber, errorCorrectionLevel) {
      var PAD0 = 0xEC, PAD1 = 0x11;
      var _typeNumber = typeNumber;
      var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
      var _modules = null, _moduleCount = 0, _dataCache = null, _dataList = [];
      var _this = {};

      var makeImpl = function(test, maskPattern) {
        _moduleCount = _typeNumber * 4 + 17;
        _modules = function(moduleCount) {
          var modules = new Array(moduleCount);
          for (var row = 0; row < moduleCount; row += 1) {
            modules[row] = new Array(moduleCount);
            for (var col = 0; col < moduleCount; col += 1) modules[row][col] = null;
          }
          return modules;
        }(_moduleCount);
        setupPositionProbePattern(0, 0);
        setupPositionProbePattern(_moduleCount - 7, 0);
        setupPositionProbePattern(0, _moduleCount - 7);
        setupPositionAdjustPattern();
        setupTimingPattern();
        setupTypeInfo(test, maskPattern);
        if (_typeNumber >= 7) setupTypeNumber(test);
        if (_dataCache == null) _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
        mapData(_dataCache, maskPattern);
      };

      var setupPositionProbePattern = function(row, col) {
        for (var r = -1; r <= 7; r += 1) {
          if (row + r <= -1 || _moduleCount <= row + r) continue;
          for (var c = -1; c <= 7; c += 1) {
            if (col + c <= -1 || _moduleCount <= col + c) continue;
            if ((0 <= r && r <= 6 && (c == 0 || c == 6)) ||
                (0 <= c && c <= 6 && (r == 0 || r == 6)) ||
                (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
              _modules[row + r][col + c] = true;
            } else {
              _modules[row + r][col + c] = false;
            }
          }
        }
      };

      var getBestMaskPattern = function() {
        var minLostPoint = 0, pattern = 0;
        for (var i = 0; i < 8; i += 1) {
          makeImpl(true, i);
          var lostPoint = QRUtil.getLostPoint(_this);
          if (i == 0 || minLostPoint > lostPoint) { minLostPoint = lostPoint; pattern = i; }
        }
        return pattern;
      };

      var setupTimingPattern = function() {
        for (var r = 8; r < _moduleCount - 8; r += 1) {
          if (_modules[r][6] != null) continue;
          _modules[r][6] = (r % 2 == 0);
        }
        for (var c = 8; c < _moduleCount - 8; c += 1) {
          if (_modules[6][c] != null) continue;
          _modules[6][c] = (c % 2 == 0);
        }
      };

      var setupPositionAdjustPattern = function() {
        var pos = QRUtil.getPatternPosition(_typeNumber);
        for (var i = 0; i < pos.length; i += 1) {
          for (var j = 0; j < pos.length; j += 1) {
            var row = pos[i], col = pos[j];
            if (_modules[row][col] != null) continue;
            for (var r = -2; r <= 2; r += 1) {
              for (var c = -2; c <= 2; c += 1) {
                if (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0)) {
                  _modules[row + r][col + c] = true;
                } else {
                  _modules[row + r][col + c] = false;
                }
              }
            }
          }
        }
      };

      var setupTypeNumber = function(test) {
        var bits = QRUtil.getBCHTypeNumber(_typeNumber);
        for (var i = 0; i < 18; i += 1) {
          var mod = (!test && ((bits >> i) & 1) == 1);
          _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
        }
        for (var i = 0; i < 18; i += 1) {
          var mod = (!test && ((bits >> i) & 1) == 1);
          _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
        }
      };

      var setupTypeInfo = function(test, maskPattern) {
        var data = (_errorCorrectionLevel << 3) | maskPattern;
        var bits = QRUtil.getBCHTypeInfo(data);
        for (var i = 0; i < 15; i += 1) {
          var mod = (!test && ((bits >> i) & 1) == 1);
          if (i < 6) _modules[i][8] = mod;
          else if (i < 8) _modules[i + 1][8] = mod;
          else _modules[_moduleCount - 15 + i][8] = mod;
        }
        for (var i = 0; i < 15; i += 1) {
          var mod = (!test && ((bits >> i) & 1) == 1);
          if (i < 8) _modules[8][_moduleCount - i - 1] = mod;
          else if (i < 9) _modules[8][15 - i - 1 + 1] = mod;
          else _modules[8][15 - i - 1] = mod;
        }
        _modules[_moduleCount - 8][8] = (!test);
      };

      var mapData = function(data, maskPattern) {
        var inc = -1, row = _moduleCount - 1, bitIndex = 7, byteIndex = 0;
        var maskFunc = QRUtil.getMaskFunction(maskPattern);
        for (var col = _moduleCount - 1; col > 0; col -= 2) {
          if (col == 6) col -= 1;
          while (true) {
            for (var c = 0; c < 2; c += 1) {
              if (_modules[row][col - c] == null) {
                var dark = false;
                if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                var mask = maskFunc(row, col - c);
                if (mask) dark = !dark;
                _modules[row][col - c] = dark;
                bitIndex -= 1;
                if (bitIndex == -1) { byteIndex += 1; bitIndex = 7; }
              }
            }
            row += inc;
            if (row < 0 || _moduleCount <= row) { row -= inc; inc = -inc; break; }
          }
        }
      };

      var createBytes = function(buffer, rsBlocks) {
        var offset = 0, maxDcCount = 0, maxEcCount = 0;
        var dcdata = new Array(rsBlocks.length), ecdata = new Array(rsBlocks.length);
        for (var r = 0; r < rsBlocks.length; r += 1) {
          var dcCount = rsBlocks[r].dataCount, ecCount = rsBlocks[r].totalCount - dcCount;
          maxDcCount = Math.max(maxDcCount, dcCount);
          maxEcCount = Math.max(maxEcCount, ecCount);
          dcdata[r] = new Array(dcCount);
          for (var i = 0; i < dcdata[r].length; i += 1) dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
          offset += dcCount;
          var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
          var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);
          var modPoly = rawPoly.mod(rsPoly);
          ecdata[r] = new Array(rsPoly.getLength() - 1);
          for (var i = 0; i < ecdata[r].length; i += 1) {
            var modIndex = i + modPoly.getLength() - ecdata[r].length;
            ecdata[r][i] = (modIndex >= 0) ? modPoly.getAt(modIndex) : 0;
          }
        }
        var totalCodeCount = 0;
        for (var i = 0; i < rsBlocks.length; i += 1) totalCodeCount += rsBlocks[i].totalCount;
        var data = new Array(totalCodeCount), index = 0;
        for (var i = 0; i < maxDcCount; i += 1)
          for (var r = 0; r < rsBlocks.length; r += 1)
            if (i < dcdata[r].length) data[index++] = dcdata[r][i];
        for (var i = 0; i < maxEcCount; i += 1)
          for (var r = 0; r < rsBlocks.length; r += 1)
            if (i < ecdata[r].length) data[index++] = ecdata[r][i];
        return data;
      };

      var createData = function(typeNumber, errorCorrectionLevel, dataList) {
        var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);
        var buffer = qrBitBuffer();
        for (var i = 0; i < dataList.length; i += 1) {
          var data = dataList[i];
          buffer.put(data.getMode(), 4);
          buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber));
          data.write(buffer);
        }
        var totalDataCount = 0;
        for (var i = 0; i < rsBlocks.length; i += 1) totalDataCount += rsBlocks[i].dataCount;
        if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
        while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
        while (true) {
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(PAD0, 8);
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(PAD1, 8);
        }
        return createBytes(buffer, rsBlocks);
      };

      _this.addData = function(data) {
        var newData = qr8BitByte(data);
        _dataList.push(newData);
        _dataCache = null;
      };
      _this.isDark = function(row, col) {
        if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) throw new Error(row + "," + col);
        return _modules[row][col];
      };
      _this.getModuleCount = function() { return _moduleCount; };
      _this.make = function() {
        if (_typeNumber < 1) {
          var typeNumber = 1;
          for (; typeNumber < 40; typeNumber++) {
            var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
            var buffer = qrBitBuffer();
            for (var i = 0; i < _dataList.length; i++) {
              var data = _dataList[i];
              buffer.put(data.getMode(), 4);
              buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber));
              data.write(buffer);
            }
            var totalDataCount = 0;
            for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
            if (buffer.getLengthInBits() <= totalDataCount * 8) break;
          }
          _typeNumber = typeNumber;
        }
        makeImpl(false, getBestMaskPattern());
      };
      return _this;
    };

    qrcode.stringToBytes = function(s) {
      var bytes = [];
      var utf8 = unescape(encodeURIComponent(s));
      for (var i = 0; i < utf8.length; i++) bytes.push(utf8.charCodeAt(i));
      return bytes;
    };

    var QRMode = { MODE_8BIT_BYTE: 4 };
    var QRErrorCorrectionLevel = { L: 1, M: 0, Q: 3, H: 2 };
    var QRMaskPattern = {};
    var QRUtil = (function() {
      var PATTERN_POSITION_TABLE = [
        [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42],
        [6, 26, 46], [6, 28, 50], [6, 30, 54], [6, 32, 58], [6, 34, 62], [6, 26, 46, 66],
        [6, 26, 48, 70], [6, 26, 50, 74], [6, 30, 54, 78], [6, 30, 56, 82], [6, 30, 58, 86],
        [6, 34, 62, 90], [6, 28, 50, 72, 94], [6, 26, 50, 74, 98], [6, 30, 54, 78, 102],
        [6, 28, 54, 80, 106], [6, 32, 58, 84, 110], [6, 30, 58, 86, 114], [6, 34, 62, 90, 118],
        [6, 26, 50, 74, 98, 122], [6, 30, 54, 78, 102, 126], [6, 26, 52, 78, 104, 130],
        [6, 30, 56, 82, 108, 134], [6, 34, 60, 86, 112, 138], [6, 30, 58, 86, 114, 142],
        [6, 34, 62, 90, 118, 146], [6, 30, 54, 78, 102, 126, 150], [6, 24, 50, 76, 102, 128, 154],
        [6, 28, 54, 80, 106, 132, 158], [6, 32, 58, 84, 110, 136, 162], [6, 26, 54, 82, 110, 138, 166],
        [6, 30, 58, 86, 114, 142, 170]
      ];
      var G15 = (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0);
      var G18 = (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0);
      var G15_MASK = (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1);
      var _this = {};
      var getBCHDigit = function(data) {
        var digit = 0;
        while (data != 0) { digit += 1; data >>>= 1; }
        return digit;
      };
      _this.getBCHTypeInfo = function(data) {
        var d = data << 10;
        while (getBCHDigit(d) - getBCHDigit(G15) >= 0) d ^= (G15 << (getBCHDigit(d) - getBCHDigit(G15)));
        return ((data << 10) | d) ^ G15_MASK;
      };
      _this.getBCHTypeNumber = function(data) {
        var d = data << 12;
        while (getBCHDigit(d) - getBCHDigit(G18) >= 0) d ^= (G18 << (getBCHDigit(d) - getBCHDigit(G18)));
        return (data << 12) | d;
      };
      _this.getPatternPosition = function(typeNumber) { return PATTERN_POSITION_TABLE[typeNumber - 1]; };
      _this.getMaskFunction = function(maskPattern) {
        switch (maskPattern) {
          case 0: return function(i, j) { return (i + j) % 2 == 0; };
          case 1: return function(i, j) { return i % 2 == 0; };
          case 2: return function(i, j) { return j % 3 == 0; };
          case 3: return function(i, j) { return (i + j) % 3 == 0; };
          case 4: return function(i, j) { return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0; };
          case 5: return function(i, j) { return (i * j) % 2 + (i * j) % 3 == 0; };
          case 6: return function(i, j) { return ((i * j) % 2 + (i * j) % 3) % 2 == 0; };

        var moduleCount = qrCode.getModuleCount(), lostPoint = 0;
        for (var row = 0; row < moduleCount; row += 1) {
          for (var col = 0; col < moduleCount; col += 1) {
            var sameCount = 0, dark = qrCode.isDark(row, col);
            for (var r = -1; r <= 1; r += 1) {

              for (var c = -1; c <= 1; c += 1) {
                if (col + c < 0 || moduleCount <= col + c) continue;
                if (r == 0 && c == 0) continue;
                if (dark == qrCode.isDark(row + r, col + c)) sameCount += 1;

            if (sameCount > 5) lostPoint += (3 + sameCount - 5);
          }
        }
        for (var row = 0; row < moduleCount - 1; row += 1) {
          for (var col = 0; col < moduleCount - 1; col += 1) {
            var count = 0;
            if (qrCode.isDark(row, col)) count += 1;
            if (qrCode.isDark(row + 1, col)) count += 1;
            if (qrCode.isDark(row, col + 1)) count += 1;
            if (qrCode.isDark(row + 1, col + 1)) count += 1;
            if (count == 0 || count == 4) lostPoint += 3;
          }
        }
        for (var row = 0; row < moduleCount; row += 1) {
          for (var col = 0; col < moduleCount - 6; col += 1) {
            if (qrCode.isDark(row, col) && !qrCode.isDark(row, col + 1) && qrCode.isDark(row, col + 2) &&
                qrCode.isDark(row, col + 3) && qrCode.isDark(row, col + 4) && !qrCode.isDark(row, col + 5) && qrCode.isDark(row, col + 6)) {
              lostPoint += 40;
            }
          }
        }
        for (var col = 0; col < moduleCount; col += 1) {
          for (var row = 0; row < moduleCount - 6; row += 1) {
            if (qrCode.isDark(row, col) && !qrCode.isDark(row + 1, col) && qrCode.isDark(row + 2, col) &&
                qrCode.isDark(row + 3, col) && qrCode.isDark(row + 4, col) && !qrCode.isDark(row + 5, col) && qrCode.isDark(row + 6, col)) {
              lostPoint += 40;
            }
          }
        }
        var darkCount = 0;
        for (var col = 0; col < moduleCount; col += 1)
          for (var row = 0; row < moduleCount; row += 1)
            if (qrCode.isDark(row, col)) darkCount += 1;
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;
        return lostPoint;
      };
      return _this;
    })();

    var QRMath = (function() {
      var EXP_TABLE = new Array(256), LOG_TABLE = new Array(256);

      for (var i = 0; i < 255; i += 1) LOG_TABLE[EXP_TABLE[i]] = i;
      var _this = {};
      _this.glog = function(n) { if (n < 1) throw new Error("glog(" + n + ")"); return LOG_TABLE[n]; };
      _this.gexp = function(n) { while (n < 0) n += 255; while (n >= 256) n -= 255; return EXP_TABLE[n]; };
      return _this;
    })();

    function qrPolynomial(num, shift) {
      if (num.length == undefined) throw new Error(num.length + "/" + shift);
      var _num = (function() {
        var offset = 0;
        while (offset < num.length && num[offset] == 0) offset += 1;
        var r = new Array(num.length - offset + shift);
        for (var i = 0; i < num.length - offset; i += 1) r[i] = num[i + offset];
        return r;
      })();
      var _this = {};
      _this.getAt = function(index) { return _num[index]; };
      _this.getLength = function() { return _num.length; };
      _this.multiply = function(e) {
        var num = new Array(_this.getLength() + e.getLength() - 1);
        for (var i = 0; i < _this.getLength(); i += 1)

            num[i + j] ^= QRMath.gexp(QRMath.glog(_this.getAt(i)) + QRMath.glog(e.getAt(j)));

      };
      _this.mod = function(e) {
        if (_this.getLength() - e.getLength() < 0) return _this;
        var ratio = QRMath.glog(_this.getAt(0)) - QRMath.glog(e.getAt(0));
        var num = new Array(_this.getLength());
        for (var i = 0; i < _this.getLength(); i += 1) num[i] = _this.getAt(i);
        for (var i = 0; i < e.getLength(); i += 1) num[i] ^= QRMath.gexp(QRMath.glog(e.getAt(i)) + ratio);
        return qrPolynomial(num, 0).mod(e);
      };
      return _this;
    }

      var qrRSBlock = function(totalCount, dataCount) { return QRRSBlockCtor(totalCount, dataCount); };
      var getRsBlockTable = function(typeNumber, errorCorrectionLevel) {
        switch (errorCorrectionLevel) {
          case QRErrorCorrectionLevel.L: return RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];

    function qrBitBuffer() {
      var _buffer = [], _length = 0, _this = {};

        var bufIndex = Math.floor(index / 8);
        return ((_buffer[bufIndex] >>> (7 - index % 8)) & 1) == 1;
      };
      _this.put = function(num, length) { for (var i = 0; i < length; i += 1) _this.putBit(((num >>> (length - i - 1)) & 1) == 1); };

      _this.putBit = function(bit) {
        var bufIndex = Math.floor(_length / 8);
        if (_buffer.length <= bufIndex) _buffer.push(0);

      };

  // ── Rendu du QR code réel sur un <canvas> puis export en PNG ──
  // (PNG plutôt que SVG : bien plus fiable dans le corps d'un email Outlook)
  function buildInlineQrDataUrl(payload) {
    var qr = qrcode(0, 'M'); // type 0 = taille auto-détectée, correction M
    qr.addData(payload);
    qr.make();

    var moduleCount = qr.getModuleCount();
    var scale = 6;
    var quiet = 4; // marge blanche obligatoire autour d'un QR code pour qu'il reste scannable
    var size = (moduleCount + quiet * 2) * scale;

    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#111827';

    for (var row = 0; row < moduleCount; row++) {
      for (var col = 0; col < moduleCount; col++) {
        if (qr.isDark(row, col)) {
          ctx.fillRect((col + quiet) * scale, (row + quiet) * scale, scale, scale);
        }
      }
    }

    return canvas.toDataURL('image/png');
  }

  function buildQrDataUrl() {
    return buildQrUrl();
  }

  function buildFallbackSignature(photoUrl) {
    const parts     = userName.trim().split(' ');
    const firstName = parts[0] || '';
    const lastName  = parts.slice(1).join(' ') || '';
    const initials  = getInitials(userName);

    const photoEl = photoUrl
      ? '<img src="' + photoUrl + '" width="65" height="65" style="border-radius:50%;object-fit:cover;border:2px solid #e5e7eb;display:block;" alt="' + userName + '"/>'
      : '<div style="width:65px;height:65px;border-radius:50%;background:linear-gradient(135deg,#1a1f5e,#2d3491);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px;">' + initials + '</div>';

    const qrUrl = buildQrDataUrl();

    signatureHtml =
      '<table style="font-family:Segoe UI,Arial,sans-serif;border-collapse:collapse;max-width:540px;">' +
      '<tr>' +
        '<td style="padding-right:16px;vertical-align:middle;">' + photoEl + '</td>' +
        '<td style="padding:0 16px;vertical-align:middle;border-left:3px solid #1a1f5e;">' +
          '<p style="margin:0 0 3px;font-size:16px;font-weight:700;color:#1a1f5e;">' + firstName + ' ' + lastName + '</p>' +
          '<p style="margin:0 0 8px;font-size:12px;color:#6b7280;">Timsoft Group</p>' +
          '<p style="margin:0 0 3px;font-size:12px;color:#374151;">✉&nbsp;<a href="mailto:' + userEmail + '" style="color:#374151;text-decoration:none;">' + userEmail + '</a></p>' +
          '<p style="margin:5px 0 0;font-size:12px;"><a href="https://www.timsoft-group.com" style="color:#1a1f5e;font-weight:600;text-decoration:none;">www.timsoft-group.com</a></p>' +
        '</td>' +
        '<td style="padding-left:16px;vertical-align:middle;text-align:center;">' +
          '<img src="' + qrUrl + '" width="80" height="80" alt="QR Code" style="border:1px solid #e5e7eb;border-radius:8px;display:block;"/>' +
          '<p style="margin:5px 0 0;font-size:9px;color:#9ca3af;line-height:1.4;">Scanner pour<br>ajouter le contact</p>' +
        '</td>' +
      '</tr>' +
      '</table>';
  }

  function loadPhotoFromOutlook() {
    return new Promise((resolve) => {
      const timer = setTimeout(() => { log('⏱ Timeout photo', 'err'); resolve(null); }, 5000);
      try {
        Office.context.mailbox.getCallbackTokenAsync({ isRest: true }, async function(result) {
          clearTimeout(timer);
          if (result.status !== Office.AsyncResultStatus.Succeeded) return resolve(null);
          const token   = result.value;
          const restUrl = Office.context.mailbox.restUrl || 'https://outlook.office.com/api';
          try {
            const res = await fetch(restUrl + '/v2.0/me/photo/$value', {
              headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
              const blob = await res.blob();
              if (blob.size === 0) return resolve(null);
              const base64 = await new Promise((res64) => {
                const reader = new FileReader();
                reader.onloadend = () => res64(reader.result);
                reader.readAsDataURL(blob);
              });
              return resolve(base64);
            }
            resolve(null);
          } catch(e) { resolve(null); }
        });
      } catch(e) {
        clearTimeout(timer);
        resolve(null);
      }
    });
  }

  function insertSignature() {
    if (!signatureHtml) return;
    const btn = document.getElementById('btn-insert');
    btn.disabled    = true;
    btn.textContent = '⏳ Insertion...';

    function done(ok, msg) {
      btn.disabled    = false;
      btn.textContent = '✅ Insérer ma signature';
      if (ok) {
        const s = document.getElementById('success');
        s.style.display = 'block';
        setTimeout(() => s.style.display = 'none', 3000);
      } else {
        showError(msg || 'Erreur insertion');
      }
    }

    try {
      if (Office.context.mailbox.item.body.setSignatureAsync) {
        Office.context.mailbox.item.body.setSignatureAsync(
          signatureHtml,
          { coercionType: Office.CoercionType.Html },
          r => done(r.status === Office.AsyncResultStatus.Succeeded, r.error && r.error.message)
        );
      } else {
        Office.context.mailbox.item.body.prependAsync(
          signatureHtml,
          { coercionType: Office.CoercionType.Html },
          r => done(r.status === Office.AsyncResultStatus.Succeeded, r.error && r.error.message)
        );
      }
    } catch(e) {
      done(false, 'Office.js non disponible hors Outlook');
    }
  }

  function getInitials(name) {
    return (name || '').split(' ')
      .map(p => p[0] || '').join('').substring(0, 2).toUpperCase() || '??';
  }

  function showLoading() {
    document.getElementById('loading').style.display   = 'block';
    document.getElementById('content').style.display   = 'none';
    document.getElementById('error-box').style.display = 'none';
  }
  function showContent() {
    document.getElementById('loading').style.display   = 'none';
    document.getElementById('content').style.display   = 'block';
    document.getElementById('error-box').style.display = 'none';
  }
  function showError(msg) {
    document.getElementById('loading').style.display   = 'none';
    document.getElementById('content').style.display   = 'none';
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('error-msg').textContent   = msg;
  }
