<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timsoft Signature</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; }
    .container { padding: 14px; max-width: 380px; }
    .header { display: flex; align-items: center; gap: 10px; padding: 14px 16px;
      background: #1a1f5e; border-radius: 12px; margin-bottom: 14px; }
    .logo { width: 36px; height: 36px; background: #fff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #1a1f5e; font-size: 13px; }
    .header h2 { color: #fff; font-size: 15px; margin-bottom: 1px; }
    .header p { color: rgba(255,255,255,0.65); font-size: 11px; }
    .loading { text-align: center; padding: 40px 20px; }
    .spinner { width: 30px; height: 30px; border: 3px solid #e5e7eb;
      border-top-color: #1a1f5e; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .user-card { display: flex; align-items: center; gap: 12px;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 12px; margin-bottom: 12px; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden;
      flex-shrink: 0; background: linear-gradient(135deg, #1a1f5e, #2d3491);
      display: flex; align-items: center; justify-content: center; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-txt { color: #fff; font-weight: 700; font-size: 16px; }
    .user-info strong { display: block; font-size: 13px; }
    .user-info small { font-size: 11px; color: #6b7280; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px; margin-top: 3px; }
    .badge.ok { background: #d1fae5; color: #065f46; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    .preview-card { background: #fff; border: 1px solid #e5e7eb;
      border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .preview-label { font-size: 11px; font-weight: 700; color: #6b7280;
      margin-bottom: 10px; text-transform: uppercase; }
    .btn-primary { width: 100%; padding: 12px;
      background: linear-gradient(135deg, #1a1f5e, #2d3491);
      color: #fff; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      margin-bottom: 8px; transition: opacity 0.15s; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary { width: 100%; padding: 10px; background: #fff;
      color: #1a1f5e; border: 1.5px solid #1a1f5e; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer; }
    .success { background: #d1fae5; color: #065f46; border-radius: 10px;
      padding: 12px; text-align: center; font-size: 13px;
      font-weight: 600; margin-top: 8px; }
    .error-box { background: #fee2e2; color: #dc2626; border-radius: 10px;
      padding: 12px; margin-bottom: 12px; font-size: 13px; }
    .debug-card { background: #0f1724; color: #d1d5db; border-radius: 10px;
      padding: 12px; margin-top: 12px; font-family: 'Consolas', monospace;
      font-size: 11px; max-height: 160px; overflow-y: auto; line-height: 1.6; }
    .debug-title { color: #9ca3af; font-weight: 700; margin-bottom: 6px;
      text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; }
    .debug-line { border-bottom: 1px solid #1f2937; padding: 3px 0; word-break: break-all; }
    .debug-ok { color: #34d399; }
    .debug-err { color: #f87171; }
    .debug-info { color: #93c5fd; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">ti</div>
    <div>
      <h2>Timsoft Signature</h2>
      <p>Gestion centralisée des signatures</p>
    </div>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p style="font-size:13px;color:#6b7280;">Chargement...</p>
  </div>

  <div id="error-box" class="error-box" style="display:none;">
    <span id="error-msg"></span><br>
    <button onclick="init()" style="margin-top:8px;background:#dc2626;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;">Réessayer</button>
  </div>

  <div id="content" style="display:none;">
    <div class="user-card">
      <div class="avatar" id="avatar">
        <span class="avatar-txt" id="initials">??</span>
      </div>
      <div class="user-info">
        <strong id="display-name">...</strong>
        <small id="display-email">...</small>
        <div class="badge ok" id="source-badge">Chargement...</div>
      </div>
    </div>

    <div class="preview-card">
      <div class="preview-label">📋 Aperçu de votre signature</div>
      <div id="preview"></div>
    </div>

    <button class="btn-primary" id="btn-insert" onclick="insertSignature()">
      ✅ Insérer ma signature
    </button>
    <button class="btn-secondary" onclick="init()">🔄 Actualiser</button>
    <div id="success" class="success" style="display:none;">
      ✅ Signature insérée dans votre email !
    </div>

    <div class="debug-card">
      <div class="debug-title">🔧 Debug — Connexion Dashboard</div>
      <div id="debug-log"></div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://cartoon-revoke-music.ngrok-free.dev/api';

  let userName      = '';
  let userEmail     = '';
  let signatureHtml = '';

  function log(msg, type) {
    console.log('[TimsoftAddin]', msg);
    const el = document.getElementById('debug-log');
    if (!el) return;
    const line = document.createElement('div');
    line.className = 'debug-line ' + (type === 'ok' ? 'debug-ok' : type === 'err' ? 'debug-err' : 'debug-info');
    line.textContent = msg;
    el.appendChild(line);
  }

  Office.onReady(async function(info) {
    if (info.host === Office.HostType.Outlook) {
      userEmail = Office.context.mailbox.userProfile.emailAddress;
      userName  = Office.context.mailbox.userProfile.displayName;
    } else {
      userEmail = 'demo@timsoft-group.com';
      userName  = 'Demo User';
    }
    await init();
  });

  async function init() {
    showLoading();
    document.getElementById('debug-log').innerHTML = '';
    log('Profil : ' + userName + ' <' + userEmail + '>', 'info');

    const initials = getInitials(userName);
    document.getElementById('initials').textContent      = initials;
    document.getElementById('display-name').textContent  = userName;
    document.getElementById('display-email').textContent = userEmail;

    log('Appel API : ' + API_URL + '/Signatures/by-email/' + userEmail + '/active', 'info');
    const dashboardHtml = await fetchSignatureFromDashboard(userEmail);

    if (dashboardHtml) {
      log('✅ Template Dashboard trouvé', 'ok');
      document.getElementById('source-badge').textContent = '✅ Template Dashboard';
      document.getElementById('source-badge').className = 'badge ok';

      const photoUrl = await loadPhotoFromOutlook();
      signatureHtml = injectPhotoAndQr(dashboardHtml, photoUrl);
      updateAvatar(photoUrl, initials);
    } else {
      log('⚠️ Dashboard indisponible ou utilisateur non trouvé — fallback générique', 'err');
      document.getElementById('source-badge').textContent = '⚠️ Signature générique (fallback)';
      document.getElementById('source-badge').className = 'badge warn';

      const photoUrl = await loadPhotoFromOutlook();
      updateAvatar(photoUrl, initials);
      buildFallbackSignature(photoUrl);
    }

    document.getElementById('preview').innerHTML = signatureHtml;
    showContent();
  }

  function updateAvatar(photoUrl, initials) {
    if (photoUrl) {
      document.getElementById('avatar').innerHTML = '<img src="' + photoUrl + '" alt="' + userName + '"/>';
      log('Avatar mis à jour avec la photo', 'ok');
    } else {
      log('Aucune photo — initiales utilisées', 'err');
    }
  }

  async function fetchSignatureFromDashboard(email) {
    const url = API_URL + '/Signatures/by-email/' + encodeURIComponent(email) + '/active';
    try {
      const res = await fetch(url, { headers: { 'ngrok-skip-browser-warning': 'true' } });
      log('Réponse API : HTTP ' + res.status, res.ok ? 'ok' : 'err');
      if (!res.ok) return null;
      const data = await res.json();
      return data.generatedHtml || null;
    } catch (e) {
      log('❌ Erreur fetch : ' + e.message, 'err');
      return null;
    }
  }

  function injectPhotoAndQr(html, photoUrl) {
    const qrUrl = buildQrUrl();
    const initials = getInitials(userName);
    const placeholder = '{{photoUrl}}';
    const idx = html.indexOf(placeholder);

    if (idx !== -1) {
      const tagStart = html.lastIndexOf('<img', idx);
      const tagEnd = html.indexOf('>', idx);
      if (tagStart !== -1 && tagEnd !== -1) {
        let replacement;
        if (photoUrl) {
          const imgTag = html.substring(tagStart, tagEnd + 1);
          replacement = imgTag.split(placeholder).join(photoUrl);
        } else {
          replacement = '<div style="width:65px;height:65px;border-radius:50%;' +
            'background:linear-gradient(135deg,#1a1f5e,#2d3491);display:flex;' +
            'align-items:center;justify-content:center;color:#fff;font-weight:700;' +
            'font-size:22px;">' + initials + '</div>';
        }
        html = html.substring(0, tagStart) + replacement + html.substring(tagEnd + 1);
      }
    }

    return html.split('{{qrCode}}').join(qrUrl);
  }

  function buildQrUrl() {
    const parts     = userName.trim().split(' ');
    const firstName = parts[0] || '';
    const lastName  = parts.slice(1).join(' ') || '';
    const vcard = [
      'BEGIN:VCARD','VERSION:3.0',
      'N:' + lastName + ';' + firstName + ';;;',
      'FN:' + firstName + ' ' + lastName,
      'ORG:Timsoft Group',
      'EMAIL:' + userEmail,
      'URL:https://www.timsoft-group.com',
      'END:VCARD'
    ].join('\n');
    return 'https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=' + encodeURIComponent(vcard);
  }

  function buildFallbackSignature(photoUrl) {
    const parts     = userName.trim().split(' ');
    const firstName = parts[0] || '';
    const lastName  = parts.slice(1).join(' ') || '';
    const initials  = getInitials(userName);

    const photoEl = photoUrl
      ? '<img src="' + photoUrl + '" width="65" height="65" style="border-radius:50%;object-fit:cover;border:2px solid #e5e7eb;display:block;" alt="' + userName + '"/>'
      : '<div style="width:65px;height:65px;border-radius:50%;background:linear-gradient(135deg,#1a1f5e,#2d3491);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px;">' + initials + '</div>';

    const qrUrl = buildQrUrl();

    signatureHtml =
      '<table style="font-family:Segoe UI,Arial,sans-serif;border-collapse:collapse;max-width:540px;">' +
      '<tr>' +
        '<td style="padding-right:16px;vertical-align:middle;">' + photoEl + '</td>' +
        '<td style="padding:0 16px;vertical-align:middle;border-left:3px solid #1a1f5e;">' +
          '<p style="margin:0 0 3px;font-size:16px;font-weight:700;color:#1a1f5e;">' + firstName + ' ' + lastName + '</p>' +
          '<p style="margin:0 0 8px;font-size:12px;color:#6b7280;">Timsoft Group</p>' +
          '<p style="margin:0 0 3px;font-size:12px;color:#374151;">✉&nbsp;<a href="mailto:' + userEmail + '" style="color:#374151;text-decoration:none;">' + userEmail + '</a></p>' +
          '<p style="margin:5px 0 0;font-size:12px;"><a href="https://www.timsoft-group.com" style="color:#1a1f5e;font-weight:600;text-decoration:none;">www.timsoft-group.com</a></p>' +
        '</td>' +
        '<td style="padding-left:16px;vertical-align:middle;text-align:center;">' +
          '<img src="' + qrUrl + '" width="80" height="80" alt="QR Code" style="border:1px solid #e5e7eb;border-radius:8px;display:block;"/>' +
          '<p style="margin:5px 0 0;font-size:9px;color:#9ca3af;line-height:1.4;">Scanner pour<br>ajouter le contact</p>' +
        '</td>' +
      '</tr>' +
      '</table>';
  }

  function loadPhotoFromOutlook() {
    return new Promise((resolve) => {
      const timer = setTimeout(() => { log('⏱ Timeout photo', 'err'); resolve(null); }, 5000);
      try {
        Office.context.mailbox.getCallbackTokenAsync({ isRest: true }, async function(result) {
          clearTimeout(timer);
          if (result.status !== Office.AsyncResultStatus.Succeeded) return resolve(null);
          const token   = result.value;
          const restUrl = Office.context.mailbox.restUrl || 'https://outlook.office.com/api';
          try {
            const res = await fetch(restUrl + '/v2.0/me/photo/$value', {
              headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
              const blob = await res.blob();
              if (blob.size === 0) return resolve(null);
              const base64 = await new Promise((res64) => {
                const reader = new FileReader();
                reader.onloadend = () => res64(reader.result);
                reader.readAsDataURL(blob);
              });
              return resolve(base64);
            }
            resolve(null);
          } catch(e) { resolve(null); }
        });
      } catch(e) {
        clearTimeout(timer);
        resolve(null);
      }
    });
  }

  function insertSignature() {
    if (!signatureHtml) return;
    const btn = document.getElementById('btn-insert');
    btn.disabled    = true;
    btn.textContent = '⏳ Insertion...';

    function done(ok, msg) {
      btn.disabled    = false;
      btn.textContent = '✅ Insérer ma signature';
      if (ok) {
        const s = document.getElementById('success');
        s.style.display = 'block';
        setTimeout(() => s.style.display = 'none', 3000);
      } else {
        showError(msg || 'Erreur insertion');
      }
    }

    try {
      if (Office.context.mailbox.item.body.setSignatureAsync) {
        Office.context.mailbox.item.body.setSignatureAsync(
          signatureHtml,
          { coercionType: Office.CoercionType.Html },
          r => done(r.status === Office.AsyncResultStatus.Succeeded, r.error && r.error.message)
        );
      } else {
        Office.context.mailbox.item.body.prependAsync(
          signatureHtml,
          { coercionType: Office.CoercionType.Html },
          r => done(r.status === Office.AsyncResultStatus.Succeeded, r.error && r.error.message)
        );
      }
    } catch(e) {
      done(false, 'Office.js non disponible hors Outlook');
    }
  }

  function getInitials(name) {
    return (name || '').split(' ')
      .map(p => p[0] || '').join('').substring(0, 2).toUpperCase() || '??';
  }

  function showLoading() {
    document.getElementById('loading').style.display   = 'block';
    document.getElementById('content').style.display   = 'none';
    document.getElementById('error-box').style.display = 'none';
  }
  function showContent() {
    document.getElementById('loading').style.display   = 'none';
    document.getElementById('content').style.display   = 'block';
    document.getElementById('error-box').style.display = 'none';
  }
  function showError(msg) {
    document.getElementById('loading').style.display   = 'none';
    document.getElementById('content').style.display   = 'none';
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('error-msg').textContent   = msg;
  }
</script>
</body>
</html>
