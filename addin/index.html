<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timsoft Signature</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; color: #0f1724; }

    .addin-container { padding: 14px; max-width: 380px; }

    /* Header */
    .addin-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #1a1f5e; border-radius: 12px; margin-bottom: 14px; }
    .logo-box { width: 36px; height: 36px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #1a1f5e; font-size: 13px; flex-shrink: 0; }
    .addin-header h2 { color: #fff; font-size: 15px; margin-bottom: 1px; }
    .addin-header p { color: rgba(255,255,255,0.65); font-size: 11px; }

    /* Loading */
    .loading-state { text-align: center; padding: 40px 20px; }
    .spinner { width: 30px; height: 30px; border: 3px solid #e5e7eb; border-top-color: #1a1f5e; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { font-size: 13px; color: #6b7280; }

    /* Error */
    .error-card { background: #fee2e2; color: #dc2626; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 13px; }
    .error-card button { margin-top: 8px; background: #dc2626; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }

    /* User card */
    .user-card { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: linear-gradient(135deg, #1a1f5e, #2d3491); display: flex; align-items: center; justify-content: center; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-initials { color: #fff; font-weight: 700; font-size: 15px; }
    .user-info strong { display: block; font-size: 13px; color: #0f1724; }
    .user-info span { font-size: 11px; color: #6b7280; }
    .connected-badge { display: inline-block; background: #d1fae5; color: #065f46; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-top: 3px; }

    /* Preview */
    .preview-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .preview-label { font-size: 11px; font-weight: 700; color: #6b7280; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .preview-content { font-size: 12px; line-height: 1.6; overflow-x: auto; }

    /* Buttons */
    .btn-insert { width: 100%; padding: 12px; background: linear-gradient(135deg, #1a1f5e, #2d3491); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 8px; transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-insert:hover { opacity: 0.88; }
    .btn-insert:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-refresh { width: 100%; padding: 10px; background: #fff; color: #1a1f5e; border: 1.5px solid #1a1f5e; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn-refresh:hover { background: #f0f2ff; }

    /* Success */
    .success-card { background: #d1fae5; color: #065f46; border-radius: 10px; padding: 12px; text-align: center; font-size: 13px; font-weight: 600; margin-top: 8px; }
  </style>
</head>
<body>

<div class="addin-container">

  <!-- Header -->
  <div class="addin-header">
    <div class="logo-box">ti</div>
    <div>
      <h2>Timsoft Signature</h2>
      <p>Gestion centralisée des signatures</p>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading-state" class="loading-state">
    <div class="spinner"></div>
    <p>Chargement de votre signature...</p>
  </div>

  <!-- Error -->
  <div id="error-card" class="error-card" style="display:none;">
    <span id="error-msg"></span>
    <br>
    <button onclick="init()">Réessayer</button>
  </div>

  <!-- Content -->
  <div id="main-content" style="display:none;">

    <!-- User info -->
    <div class="user-card">
      <div class="avatar" id="avatar-wrap">
        <span class="avatar-initials" id="user-initials">??</span>
      </div>
      <div class="user-info">
        <strong id="user-name">Chargement...</strong>
        <span id="user-email">Chargement...</span>
        <div class="connected-badge">✅ Connecté à Timsoft</div>
      </div>
    </div>

    <!-- Signature preview -->
    <div class="preview-card">
      <div class="preview-label">📋 Aperçu de votre signature</div>
      <div id="signature-preview" class="preview-content"></div>
    </div>

    <!-- Actions -->
    <button class="btn-insert" id="btn-insert" onclick="insertSignature()">
      ✅ Insérer ma signature
    </button>
    <button class="btn-refresh" onclick="init()">🔄 Actualiser</button>
    <div id="success-card" class="success-card" style="display:none;">
      ✅ Signature insérée avec succès !
    </div>

  </div>
</div>

<script>
  // ── CONFIG ────────────────────────────────────────────────────
  const API_URL = 'https://timsoft-signature-api-a0g4gseddgccarc4.francecentral-01.azurewebsites.net/api';
  const CLIENT_ID = '71f7a98c-a1d9-4468-997c-f822a1592450';
  const TENANT_ID = '8a0bbcfe-47d4-48f3-974e-faa186c02e32';

  // ── STATE ─────────────────────────────────────────────────────
  let userName = '';
  let userEmail = '';
  let signatureHtml = '';
  let graphToken = null;
  let msalInstance = null;

  // ── MSAL CONFIG ───────────────────────────────────────────────
  const msalConfig = {
    auth: {
      clientId: CLIENT_ID,
      authority: `https://login.microsoftonline.com/${TENANT_ID}`,
      redirectUri: window.location.href,
    },
    cache: { cacheLocation: 'localStorage' }
  };

  // ── INIT ──────────────────────────────────────────────────────
  Office.onReady(async function(info) {
    if (info.host === Office.HostType.Outlook) {
      userEmail = Office.context.mailbox.userProfile.emailAddress;
      userName  = Office.context.mailbox.userProfile.displayName;
    } else {
      // Mode démo hors Outlook
      userEmail = 'demo@timsoft-group.com';
      userName  = 'Demo User';
    }
    await init();
  });

  async function init() {
    showLoading();
    try {
      // 1. Tenter d'obtenir un token Graph pour la photo
      graphToken = await getGraphToken();

      // 2. Mettre à jour l'UI utilisateur
      updateUserCard();

      // 3. Charger la signature + photo + QR
      await loadSignature();

    } catch(e) {
      showError('Erreur de chargement : ' + e.message);
    }
  }

  // ── GRAPH TOKEN ───────────────────────────────────────────────
  async function getGraphToken() {
    try {
      msalInstance = new msal.PublicClientApplication(msalConfig);
      await msalInstance.initialize();

      const accounts = msalInstance.getAllAccounts();
      if (accounts.length > 0) {
        const result = await msalInstance.acquireTokenSilent({
          scopes: ['User.Read'],
          account: accounts[0]
        });
        return result.accessToken;
      }
    } catch(e) {
      // Pas de token Graph — on continue sans photo Graph
      console.log('Graph token non disponible:', e.message);
    }
    return null;
  }

  // ── PHOTO DEPUIS GRAPH ────────────────────────────────────────
  async function loadGraphPhoto() {
    if (!graphToken) return null;
    try {
      const response = await fetch(
        'https://graph.microsoft.com/v1.0/me/photo/$value',
        { headers: { 'Authorization': `Bearer ${graphToken}` } }
      );
      if (response.ok) {
        const blob = await response.blob();
        return URL.createObjectURL(blob);
      }
    } catch(e) {
      console.log('Photo Graph non disponible');
    }
    return null;
  }

  // ── UI USER CARD ──────────────────────────────────────────────
  function updateUserCard() {
    const parts = userName.split(' ');
    const initials = parts.map(p => p[0] || '').join('').substring(0, 2).toUpperCase();
    document.getElementById('user-initials').textContent = initials;
    document.getElementById('user-name').textContent = userName;
    document.getElementById('user-email').textContent = userEmail;
  }

  // ── LOAD SIGNATURE ────────────────────────────────────────────
  async function loadSignature() {
    try {
      // Récupérer la photo depuis Graph en parallèle
      const photoPromise = loadGraphPhoto();

      // Récupérer les données utilisateur depuis le backend
      const authData = localStorage.getItem('auth_token');
      let userDeptId = null;
      let userData = null;

      if (authData) {
        const auth = JSON.parse(authData);
        userDeptId = auth.departmentId;
        userData = auth;
      }

      // Si pas d'auth locale, chercher par email
      if (!userDeptId) {
        try {
          const userRes = await fetch(
            `${API_URL}/Users/by-email/${encodeURIComponent(userEmail)}`,
            { headers: getHeaders(authData) }
          );
          if (userRes.ok) {
            userData = await userRes.json();
            userDeptId = userData.departmentId;
          }
        } catch(e) { console.log('User lookup failed'); }
      }

      // Attendre la photo Graph
      const photoUrl = await photoPromise;

      // Mettre à jour l'avatar si photo disponible
      if (photoUrl) {
        const avatarWrap = document.getElementById('avatar-wrap');
        avatarWrap.innerHTML = `<img src="${photoUrl}" alt="${userName}"/>`;
      }

      // Récupérer la signature active du département
      if (userDeptId) {
        const sigRes = await fetch(
          `${API_URL}/Signatures/department/${userDeptId}/active`,
          { headers: getHeaders(authData) }
        );
        if (sigRes.ok) {
          const sig = await sigRes.json();
          if (sig && sig.contenuHTML) {
            await buildSignature(sig.contenuHTML, userData, photoUrl);
            showContent();
            return;
          }
        }
      }

      // Fallback : signature par défaut
      await buildDefaultSignature(userData, photoUrl);
      showContent();

    } catch(e) {
      await buildDefaultSignature(null, null);
      showContent();
    }
  }

  // ── BUILD SIGNATURE AVEC PHOTO + QR ──────────────────────────
  async function buildSignature(templateHtml, userData, photoUrl) {
    // Générer le QR code via API externe (vCard)
    const vCard = buildVCard(userData);
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(vCard)}`;

    // Photo : Graph > userData.photoUrl > initiales
    const photoSrc = photoUrl || userData?.photoUrl || null;
    const photoHtml = photoSrc
      ? `<img src="${photoSrc}" width="60" height="60" style="border-radius:50%;object-fit:cover;border:2px solid #e5e7eb;" alt="${userName}"/>`
      : `<div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#1a1f5e,#2d3491);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;">${getInitials()}</div>`;

    // Remplacer les placeholders
    let html = templateHtml
      .replace(/\{\{firstName\}\}/g, userData?.firstName || userName.split(' ')[0] || '')
      .replace(/\{\{lastName\}\}/g, userData?.lastName || userName.split(' ')[1] || '')
      .replace(/\{\{businessEmail\}\}/g, userData?.businessEmail || userEmail)
      .replace(/\{\{mobilePhone\}\}/g, userData?.mobilePhone || '')
      .replace(/\{\{officePhone\}\}/g, userData?.officePhone || '')
      .replace(/\{\{position\}\}/g, userData?.position || '')
      .replace(/\{\{companyName\}\}/g, userData?.companyName || 'Timsoft Group')
      .replace(/\{\{websiteUrl\}\}/g, userData?.websiteUrl || 'www.timsoft-group.com')
      .replace(/\{\{photoUrl\}\}/g, photoSrc || '')
      .replace(/\{\{qrCode\}\}/g, qrUrl);

    // Injecter photo + QR si le template ne les contient pas déjà
    if (!html.includes('photoUrl') && !html.includes('<img')) {
      html = buildSignatureTable(userData, photoHtml, qrUrl, html);
    }

    signatureHtml = html;
    document.getElementById('signature-preview').innerHTML = html;
  }

  // ── SIGNATURE PAR DÉFAUT ──────────────────────────────────────
  async function buildDefaultSignature(userData, photoUrl) {
    const vCard = buildVCard(userData);
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(vCard)}`;

    const photoSrc = photoUrl || userData?.photoUrl || null;
    const photoHtml = photoSrc
      ? `<img src="${photoSrc}" width="60" height="60" style="border-radius:50%;object-fit:cover;border:2px solid #e5e7eb;" alt="${userName}"/>`
      : `<div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#1a1f5e,#2d3491);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;">${getInitials()}</div>`;

    const html = buildSignatureTable(userData, photoHtml, qrUrl, null);
    signatureHtml = html;
    document.getElementById('signature-preview').innerHTML = html;
  }

  // ── BUILD TABLE HTML SIGNATURE ────────────────────────────────
  function buildSignatureTable(userData, photoHtml, qrUrl, customHtml) {
    const firstName = userData?.firstName || userName.split(' ')[0] || userName;
    const lastName  = userData?.lastName  || userName.split(' ')[1] || '';
    const position  = userData?.position  || '';
    const email     = userData?.businessEmail || userEmail;
    const phone     = userData?.mobilePhone || '';
    const website   = userData?.websiteUrl || 'www.timsoft-group.com';

    if (customHtml) return customHtml;

    return `
<table style="font-family:Segoe UI,Arial,sans-serif;border-collapse:collapse;max-width:520px;">
  <tr>
    <!-- Photo -->
    <td style="padding:0 14px 0 0;vertical-align:middle;">
      ${photoHtml}
    </td>

    <!-- Infos -->
    <td style="padding:0 14px 0 0;vertical-align:middle;border-left:3px solid #1a1f5e;padding-left:14px;">
      <p style="margin:0 0 2px;font-size:15px;font-weight:700;color:#1a1f5e;">${firstName} ${lastName}</p>
      ${position ? `<p style="margin:0 0 6px;font-size:12px;color:#6b7280;">${position}</p>` : ''}
      <p style="margin:0 0 2px;font-size:12px;color:#374151;">
        <span style="color:#1a1f5e;">✉</span>&nbsp;
        <a href="mailto:${email}" style="color:#374151;text-decoration:none;">${email}</a>
      </p>
      ${phone ? `
      <p style="margin:0 0 2px;font-size:12px;color:#374151;">
        <span style="color:#1a1f5e;">📞</span>&nbsp;${phone}
      </p>` : ''}
      <p style="margin:4px 0 0;font-size:12px;">
        <a href="https://${website}" style="color:#1a1f5e;text-decoration:none;font-weight:600;">${website}</a>
      </p>
      <p style="margin:6px 0 0;font-size:11px;color:#9ca3af;font-style:italic;">Timsoft Group</p>
    </td>

    <!-- QR Code -->
    <td style="padding-left:14px;vertical-align:middle;text-align:center;">
      <img src="${qrUrl}" width="75" height="75" alt="QR Code" style="display:block;border:1px solid #e5e7eb;border-radius:6px;"/>
      <p style="margin:4px 0 0;font-size:9px;color:#9ca3af;">Scanner pour<br>ajouter le contact</p>
    </td>
  </tr>
</table>`;
  }

  // ── VCARD POUR QR ─────────────────────────────────────────────
  function buildVCard(userData) {
    const firstName = userData?.firstName || userName.split(' ')[0] || userName;
    const lastName  = userData?.lastName  || userName.split(' ')[1] || '';
    const email     = userData?.businessEmail || userEmail;
    const phone     = userData?.mobilePhone || '';
    const position  = userData?.position || '';

    return [
      'BEGIN:VCARD',
      'VERSION:3.0',
      `N:${lastName};${firstName};;;`,
      `FN:${firstName} ${lastName}`,
      'ORG:Timsoft Group',
      position ? `TITLE:${position}` : '',
      `EMAIL:${email}`,
      phone ? `TEL:${phone}` : '',
      'URL:https://www.timsoft-group.com',
      'END:VCARD'
    ].filter(Boolean).join('\n');
  }

  // ── INSERT SIGNATURE ──────────────────────────────────────────
  function insertSignature() {
    if (!signatureHtml) return;
    const btn = document.getElementById('btn-insert');
    btn.disabled = true;
    btn.textContent = '⏳ Insertion...';

    try {
      Office.context.mailbox.item.body.setSignatureAsync(
        signatureHtml,
        { coercionType: Office.CoercionType.Html },
        function(result) {
          if (result.status === Office.AsyncResultStatus.Succeeded) {
            document.getElementById('success-card').style.display = 'block';
            setTimeout(() => {
              document.getElementById('success-card').style.display = 'none';
            }, 3000);
          } else {
            showError('Erreur lors de l\'insertion.');
          }
          btn.disabled = false;
          btn.textContent = '✅ Insérer ma signature';
        }
      );
    } catch(e) {
      showError('Office.js non disponible hors Outlook.');
      btn.disabled = false;
      btn.textContent = '✅ Insérer ma signature';
    }
  }

  // ── HELPERS ───────────────────────────────────────────────────
  function getInitials() {
    return userName.split(' ').map(p => p[0] || '').join('').substring(0, 2).toUpperCase();
  }

  function getHeaders(authData) {
    const headers = { 'Content-Type': 'application/json' };
    if (authData) {
      try {
        const auth = JSON.parse(authData);
        if (auth.token) headers['Authorization'] = `Bearer ${auth.token}`;
      } catch(e) {}
    }
    return headers;
  }

  function showLoading() {
    document.getElementById('loading-state').style.display = 'block';
    document.getElementById('main-content').style.display  = 'none';
    document.getElementById('error-card').style.display    = 'none';
  }

  function showContent() {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-content').style.display  = 'block';
    document.getElementById('error-card').style.display    = 'none';
  }

  function showError(msg) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-content').style.display  = 'none';
    document.getElementById('error-card').style.display    = 'block';
    document.getElementById('error-msg').textContent       = msg;
  }
</script>

</body>
</html>
